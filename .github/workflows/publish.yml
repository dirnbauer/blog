name: Publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  # Explicit opt-out: this repository does not publish to the TYPO3 Extension Repository (TER).
  TER_PUBLISH_ENABLED: 'false'

jobs:
  publish:
    name: Publish new version to TER
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if ! [[ "${GITHUB_REF}" =~ ^refs/tags/v?[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Unexpected tag format: ${GITHUB_REF}" >&2
            echo "Expected refs/tags/X.Y.Z or refs/tags/vX.Y.Z" >&2
            exit 1
          fi

      - name: Derive version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          echo "VERSION=${tag}" >> "$GITHUB_ENV"

      - name: Derive release comment
        run: |
          comment=$(git tag -l "v${VERSION}" --format='%(contents)' 2>/dev/null || true)
          if [[ -z "${comment// }" ]]; then
            comment=$(git tag -l "${VERSION}" --format='%(contents)' 2>/dev/null || true)
          fi
          if [[ -z "${comment// }" ]]; then
            comment="Released version ${VERSION}"
          fi
          {
            echo 'TAILOR_COMMENT<<EOF'
            echo "$comment"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Check TER publish opt-in
        id: ter
        run: |
          if [[ "${TER_PUBLISH_ENABLED}" != "true" ]]; then
            echo "::notice::TER publish is disabled for this repository."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "${TYPO3_API_TOKEN}" ]]; then
            echo "::warning::TYPO3_API_TOKEN is not configured. Skipping TER publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.ter.outputs.publish == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2
          coverage: none

      - name: Install Tailor
        if: steps.ter.outputs.publish == 'true'
        run: composer global require typo3/tailor:^1.7 --prefer-dist --no-progress --no-suggest

      - name: Sync extension version
        if: steps.ter.outputs.publish == 'true'
        run: |
          "$(composer global config bin-dir --absolute)/tailor" set-version "${VERSION}"

      - name: Publish to TER
        if: steps.ter.outputs.publish == 'true'
        run: |
          "$(composer global config bin-dir --absolute)/tailor" ter:publish --comment "${TAILOR_COMMENT}" "${VERSION}"
